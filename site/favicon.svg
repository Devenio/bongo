<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="bongo-title">
  <title id="bongo-title">Bongo, the chaos-testing monkey</title>
  <!-- ears -->
  <circle cx="62" cy="160" r="40" fill="#7A4A2A"/>
  <circle cx="62" cy="160" r="24" fill="#F2C9A0"/>
  <circle cx="258" cy="160" r="40" fill="#7A4A2A"/>
  <circle cx="258" cy="160" r="24" fill="#F2C9A0"/>
  <!-- head -->
  <ellipse cx="160" cy="160" rx="104" ry="100" fill="#8B5A33"/>
  <!-- tuft -->
  <path d="M140 66 Q150 36 162 62 Q170 40 182 66" fill="none" stroke="#8B5A33" stroke-width="12" stroke-linecap="round"/>
  <!-- face -->
  <path d="M160 108 C126 82 78 104 86 148 C70 186 104 236 160 236 C216 236 250 186 234 148 C242 104 194 82 160 108 Z" fill="#F2C9A0"/>
  <!-- goggles strap -->
  <rect x="56" y="88" width="208" height="14" rx="7" fill="#1E2A1C"/>
  <!-- goggles -->
  <g>
    <circle cx="124" cy="94" r="26" fill="#FFD23F" stroke="#1E2A1C" stroke-width="7"/>
    <circle cx="196" cy="94" r="26" fill="#FFD23F" stroke="#1E2A1C" stroke-width="7"/>
    <rect x="146" y="88" width="28" height="10" rx="5" fill="#1E2A1C"/>
    <path d="M110 84 L120 78" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <path d="M182 84 L192 78" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>
  <!-- eyes -->
  <g class="bongo-eyes">
    <ellipse cx="130" cy="148" rx="15" ry="18" fill="#FFFFFF"/>
    <ellipse cx="190" cy="148" rx="15" ry="18" fill="#FFFFFF"/>
    <circle cx="135" cy="152" r="8" fill="#1E2A1C"/>
    <circle cx="195" cy="152" r="8" fill="#1E2A1C"/>
    <circle cx="138" cy="148" r="2.6" fill="#FFFFFF"/>
    <circle cx="198" cy="148" r="2.6" fill="#FFFFFF"/>
  </g>
  <!-- mischievous brows -->
  <path d="M112 126 Q128 118 146 128" fill="none" stroke="#5C361C" stroke-width="6" stroke-linecap="round"/>
  <path d="M174 124 Q192 114 208 122" fill="none" stroke="#5C361C" stroke-width="6" stroke-linecap="round"/>
  <!-- nose -->
  <ellipse cx="152" cy="180" rx="4" ry="3" fill="#5C361C"/>
  <ellipse cx="168" cy="180" rx="4" ry="3" fill="#5C361C"/>
  <!-- grin -->
  <path d="M118 196 Q160 238 206 192 Q164 214 118 196 Z" fill="#5C1F1F"/>
  <rect x="150" y="200" width="16" height="10" rx="2" fill="#FFFFFF"/>
  <!-- cheeks -->
  <circle cx="104" cy="190" r="9" fill="#F08A7A" opacity=".5"/>
  <circle cx="216" cy="186" r="9" fill="#F08A7A" opacity=".5"/>
  <!-- banana in hand -->
  <g class="bongo-banana" transform="translate(222 214) rotate(-18)">
    <path d="M0 40 C10 6 52 -8 82 4 C60 6 30 20 18 46 Z" fill="#FFD23F" stroke="#C99A00" stroke-width="4" stroke-linejoin="round"/>
    <path d="M80 4 L90 -2" stroke="#5C361C" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="14" cy="48" rx="20" ry="16" fill="#8B5A33"/>
    <ellipse cx="18" cy="44" rx="10" ry="8" fill="#F2C9A0"/>
  </g>
</svg>
